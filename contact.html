<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Duckzi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --white: #ffffff; --dark: #111111; --mid: #777777; --font: 'Rubik', sans-serif; }
    body { font-family: var(--font); background: var(--dark); color: var(--white); overflow-x: hidden; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      padding: 1.5rem 2.5rem; display: flex; align-items: center; justify-content: space-between;
      background: rgba(17,17,17,0.92); backdrop-filter: blur(12px);
    }
    .nav-logo { font-size: 1.1rem; font-weight: 700; color: var(--white); text-decoration: none; letter-spacing: 0.05em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--white); }
    .nav-socials { display: flex; gap: 1.25rem; }
    .nav-socials a { color: rgba(255,255,255,0.5); font-size: 1rem; text-decoration: none; transition: color 0.2s; }
    .nav-socials a:hover { color: var(--white); }

    /* PAGE */
    .page-top {
      padding: 10rem 2.5rem 5rem;
      max-width: 760px;
      margin: 0 auto;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .page-eyebrow {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--mid); margin-bottom: 1.5rem;
    }

    .page-top h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900; line-height: 0.95;
      letter-spacing: -0.03em; text-transform: uppercase;
    }

    /* CONTENT */
    .content {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 2.5rem;
    }

    /* EMAIL SECTION */
    .contact-section {
      padding: 4rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .section-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--mid); margin-bottom: 2rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

    .contact-email-block {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .email-icon {
      width: 52px; height: 52px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: rgba(255,255,255,0.4);
    }

    .email-details p {
      font-size: 0.78rem; color: var(--mid); margin-bottom: 0.3rem;
      letter-spacing: 0.05em;
    }

    /* REPLACE THIS with your actual name and email */
    .email-details a {
      font-size: 1.25rem; font-weight: 700; color: var(--white);
      text-decoration: none; letter-spacing: -0.01em;
      transition: opacity 0.2s;
    }
    .email-details a:hover { opacity: 0.65; }

    /* NEWSLETTER SECTION */
    .newsletter-section {
      padding: 4rem 0 6rem;
    }

    .newsletter-intro {
      margin-bottom: 2.5rem;
    }

    .newsletter-intro h2 {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 900; letter-spacing: -0.03em;
      text-transform: uppercase; margin-bottom: 0.75rem;
    }

    .newsletter-intro p {
      font-size: 0.92rem; color: rgba(255,255,255,0.45);
      line-height: 1.75; max-width: 460px;
    }

    .beehiiv-wrap {
      background: transparent;
    }

    .beehiiv-wrap iframe {
      border: none !important;
      background: transparent !important;
      color-scheme: dark;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.72rem; letter-spacing: 0.1em; color: var(--mid);
    }

    @media (max-width: 768px) {
      nav { padding: 1.25rem; } .nav-links { display: none; }
      .page-top { padding: 7rem 1.25rem 3rem; }
      .content { padding: 0 1.25rem; }
      footer { flex-direction: column; gap: 0.5rem; text-align: center; padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html">Duckzi</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="post.html?id=mira-game-jam">Mira</a></li>
      <li><a href="minecraft.html">Minecraft</a></li>
      <li><a href="art.html">Art</a></li>
      <li><a href="universe.html">Universe</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-socials">
      <a href="https://www.instagram.com/william._schell/" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" title="Reddit"><i class="fa-brands fa-reddit-alien"></i></a>
      <a href="contact.html" title="Contact"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </nav>

  <div class="page-top">
    <p class="page-eyebrow">Get in touch</p>
    <h1>Contact</h1>
  </div>

  <div class="content">

    <!-- EMAIL -->
    <div class="contact-section">
      <p class="section-label">Direct email</p>
      <div class="contact-email-block">
        <div class="email-icon"><i class="fa-solid fa-envelope"></i></div>
        <div class="email-details">
          <p><!-- YOUR NAME HERE e.g. William Schell --></p>
          <a href="mailto:<!-- YOUR EMAIL HERE e.g. william@example.com -->"><!-- YOUR EMAIL HERE --></a>
        </div>
      </div>
    </div>

    <!-- NEWSLETTER -->
    <div class="newsletter-section">
      <p class="section-label">Newsletter</p>
      <div class="newsletter-intro">
        <h2>Stay in the loop</h2>
        <p>Game updates, devlogs, new art, and whatever else is happening in the universe. No spam — just the work.</p>
      </div>
      <div class="beehiiv-wrap">
        <script async src="https://subscribe-forms.beehiiv.com/v3/loader.js" data-beehiiv-form="24812629-c200-4155-993d-41bdb7cbe4c3"></script>
      </div>
    </div>

  </div>

  <footer>
    <span>© 2025 William Schell / Duckzi</span>
    <div style="display:flex;gap:1.25rem;">
      <a href="https://www.instagram.com/william._schell/" style="color:inherit;text-decoration:none;"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" style="color:inherit;text-decoration:none;"><i class="fa-brands fa-reddit-alien"></i></a>
    </div>
  </footer>
  <script>
    // Beehiiv injects multiple iframes — hide everything after the first
    function hideExtraBeehiivIframes() {
      const wrap = document.querySelector('.beehiiv-wrap');
      if (!wrap) return;
      const iframes = wrap.querySelectorAll('iframe');
      iframes.forEach((f, i) => {
        if (i > 0) f.style.display = 'none';
      });
    }

    // Run on load and again after a short delay in case Beehiiv loads slowly
    window.addEventListener('load', () => {
      hideExtraBeehiivIframes();
      setTimeout(hideExtraBeehiivIframes, 1000);
      setTimeout(hideExtraBeehiivIframes, 3000);
    });

    // Also watch for Beehiiv adding iframes dynamically
    const observer = new MutationObserver(hideExtraBeehiivIframes);
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
