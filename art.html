<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art — Duckzi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --white: #ffffff; --dark: #111111; --mid: #777777; --font: 'Rubik', sans-serif; }
    body { font-family: var(--font); background: var(--dark); color: var(--white); overflow-x: hidden; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      padding: 1.5rem 2.5rem; display: flex; align-items: center; justify-content: space-between;
      background: rgba(17,17,17,0.92); backdrop-filter: blur(12px);
    }
    .nav-logo { font-size: 1.1rem; font-weight: 700; color: var(--white); text-decoration: none; letter-spacing: 0.05em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--white); }
    .nav-socials { display: flex; gap: 1.25rem; }
    .nav-socials a { color: rgba(255,255,255,0.5); font-size: 1rem; text-decoration: none; transition: color 0.2s; }
    .nav-socials a:hover { color: var(--white); }

    .page-top { padding: 10rem 2.5rem 4rem; border-bottom: 1px solid rgba(255,255,255,0.08); max-width: 1200px; margin: 0 auto; }
    .page-eyebrow { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mid); margin-bottom: 1.5rem; }
    .page-top h1 { font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; margin-bottom: 1.5rem; }
    .page-top p { font-size: 0.92rem; color: rgba(255,255,255,0.5); line-height: 1.7; }

    /* FILTER */
    .filter-row {
      max-width: 1200px; margin: 0 auto;
      padding: 2rem 2.5rem;
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .filter-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--mid); margin-right: 0.5rem; }
    .filter-btn {
      font-family: var(--font); font-size: 0.68rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: transparent; border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5); padding: 0.4rem 1rem; border-radius: 1px;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.4); }
    .filter-btn.active { background: var(--white); color: var(--dark); border-color: var(--white); }

    /* MASONRY-ISH GRID */
    .art-grid {
      max-width: 1200px; margin: 0 auto;
      padding: 2.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .art-card {
      display: block; text-decoration: none; color: inherit;
      position: relative; overflow: hidden; background: #1a1a1a;
      aspect-ratio: 1 / 1;
    }

    .art-card.hidden { display: none; }

    .art-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease, filter 0.3s; filter: brightness(0.9); }
    .art-card:hover img { transform: scale(1.05); filter: brightness(1); }

    .art-card-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0);
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
      opacity: 0;
      transition: opacity 0.3s, background 0.3s;
    }

    .art-card:hover .art-card-overlay {
      background: rgba(0,0,0,0.55);
      opacity: 1;
    }

    .art-card-title { font-size: 0.95rem; font-weight: 700; color: var(--white); margin-bottom: 0.25rem; }
    .art-card-sub { font-size: 0.72rem; color: rgba(255,255,255,0.6); letter-spacing: 0.08em; }

    .art-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; background: #1e1e1e;
    }

    .empty-msg { color: var(--mid); font-size: 0.9rem; padding: 4rem 0; text-align: center; grid-column: 1 / -1; }
    .loading-msg { color: var(--mid); font-size: 0.88rem; padding: 1rem 0; }

    footer { border-top: 1px solid rgba(255,255,255,0.08); padding: 2.5rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.72rem; letter-spacing: 0.1em; color: var(--mid); }

    @media (max-width: 700px) {
      nav { padding: 1.25rem; } .nav-links { display: none; }
      .page-top, .filter-row { padding-left: 1.25rem; padding-right: 1.25rem; }
      .art-grid { grid-template-columns: 1fr 1fr; padding: 1.25rem; }
      footer { flex-direction: column; gap: 0.5rem; text-align: center; padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html">Duckzi</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="mira.html">Mira</a></li>
      <li><a href="minecraft.html">Minecraft</a></li>
      <li><a href="art.html" class="active">Art</a></li>
      <li><a href="universe.html">Universe</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-socials">
      <a href="https://www.instagram.com/william._schell/"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-reddit-alien"></i></a>
      <a href="contact.html"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </nav>

  <div class="page-top">
    <p class="page-eyebrow">Portfolio</p>
    <h1>Art</h1>
    <p>Concept art, character sheets, fan art, and more.</p>
  </div>

  <div class="filter-row" id="filter-bar">
    <span class="filter-label">Filter</span>
    <button class="filter-btn active" data-filter="all">All</button>
  </div>

  <div class="art-grid" id="posts-container">
    <p class="loading-msg">Loading...</p>
  </div>

  <footer>
    <span>© 2025 William Schell / Duckzi</span>
    <div style="display:flex;gap:1.25rem;">
      <a href="https://www.instagram.com/william._schell/" style="color:inherit;text-decoration:none;"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" style="color:inherit;text-decoration:none;"><i class="fa-brands fa-reddit-alien"></i></a>
    </div>
  </footer>

  <script>
    function fmtDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); }
    const HIDDEN_TAGS = ['art','concept-art'];
    const TAG_LABELS = { 'overwatch':'Overwatch','cobblemon':'Cobblemon','universe':'Universe','character-design':'Characters','minecraft':'Minecraft','fan-art':'Fan Art','landscape':'Landscapes','creature':'Creatures' };
    let activeFilter = 'all';

    function renderCards(posts) {
      const c = document.getElementById('posts-container');
      if (!posts.length) { c.innerHTML = '<p class="empty-msg">Nothing here yet — check back soon.</p>'; return; }
      c.innerHTML = posts.map(p => {
        const visibleTags = (p.tags||[]).filter(t => !HIDDEN_TAGS.includes(t));
        const imgSrc = (p.images && p.images.filter(Boolean)[0]) || p.image || '';
        const inner = imgSrc
          ? `<img src="${imgSrc}" alt="${p.title}" onerror="this.style.display='none'">`
          : `<div class="art-placeholder">🎨</div>`;
        return `
          <a class="art-card" href="post.html?id=${p.id}" data-tags="${(p.tags||[]).join(' ')}">
            ${inner}
            <div class="art-card-overlay">
              <div class="art-card-title">${p.title}</div>
              <div class="art-card-sub">${visibleTags.map(t => TAG_LABELS[t]||t).join(' · ')}</div>
            </div>
          </a>`;
      }).join('');
      applyFilter(activeFilter);
    }

    function applyFilter(tag) {
      activeFilter = tag;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === tag));
      document.querySelectorAll('.art-card').forEach(c => {
        c.classList.toggle('hidden', tag !== 'all' && !c.dataset.tags.split(' ').includes(tag));
      });
      const visible = [...document.querySelectorAll('.art-card')].filter(c => !c.classList.contains('hidden'));
      const existing = document.querySelector('.empty-msg');
      if (existing) existing.remove();
      if (!visible.length) {
        const m = document.createElement('p'); m.className='empty-msg'; m.textContent='No art in this category yet.';
        document.getElementById('posts-container').appendChild(m);
      }
    }

    function buildFilters(posts) {
      const tagSet = new Set();
      posts.forEach(p => (p.tags||[]).forEach(t => { if (!HIDDEN_TAGS.includes(t)) tagSet.add(t); }));
      const bar = document.getElementById('filter-bar');
      tagSet.forEach(tag => {
        const b = document.createElement('button');
        b.className='filter-btn'; b.dataset.filter=tag;
        b.textContent = TAG_LABELS[tag]||tag;
        b.addEventListener('click', () => applyFilter(tag));
        bar.appendChild(b);
      });
      document.querySelector('[data-filter="all"]').addEventListener('click', () => applyFilter('all'));
    }

    fetch('posts.json').then(r=>r.json()).then(posts => {
      const art = posts.filter(p => p.type==='art').sort((a,b) => new Date(b.date)-new Date(a.date));
      buildFilters(art); renderCards(art);
    }).catch(() => { document.getElementById('posts-container').innerHTML = '<p class="loading-msg">Could not load posts.</p>'; });
  </script>
</body>
</html>
