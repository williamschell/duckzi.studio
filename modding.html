<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modding — Duckzi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --white: #ffffff; --dark: #111111; --mid: #777777; --font: 'Rubik', sans-serif; }
    body { font-family: var(--font); background: var(--dark); color: var(--white); overflow-x: hidden; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; padding: 1.5rem 2.5rem; display: flex; align-items: center; justify-content: space-between; background: rgba(17,17,17,0.92); backdrop-filter: blur(12px); }
    .nav-logo { font-size: 1.1rem; font-weight: 700; color: var(--white); text-decoration: none; letter-spacing: 0.05em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--white); }
    .nav-socials { display: flex; gap: 1.25rem; }
    .nav-socials a { color: rgba(255,255,255,0.5); font-size: 1rem; text-decoration: none; transition: color 0.2s; }
    .nav-socials a:hover { color: var(--white); }

    .page-top { padding: 10rem 2.5rem 4rem; border-bottom: 1px solid rgba(255,255,255,0.08); max-width: 1200px; margin: 0 auto; }
    .page-eyebrow { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mid); margin-bottom: 1.5rem; }
    .page-top h1 { font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; margin-bottom: 1.5rem; }
    .page-top p { font-size: 0.92rem; color: rgba(255,255,255,0.5); line-height: 1.7; }

    .section-inner { max-width: 1200px; margin: auto; padding: 0; }

    .post-row { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(255,255,255,0.08); text-decoration: none; color: inherit; transition: background 0.2s; }
    .post-row:last-child { border-bottom: 1px solid rgba(255,255,255,0.08); }
    .post-row:hover { background: rgba(255,255,255,0.03); }

    .post-row-img { aspect-ratio: 16/9; overflow: hidden; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .post-row-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .post-row:hover .post-row-img img { transform: scale(1.03); }

    .post-row-body { padding: 2.5rem 3rem; display: flex; flex-direction: column; justify-content: center; gap: 0.75rem; }
    .post-tag { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mid); }
    .post-row-body h3 { font-size: clamp(1.4rem, 2.5vw, 2rem); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: var(--white); }
    .post-row-body p { font-size: 0.88rem; color: rgba(255,255,255,0.5); line-height: 1.7; max-width: 380px; }
    .post-date { font-size: 0.68rem; color: var(--mid); letter-spacing: 0.1em; }
    .post-arrow { margin-top: auto; padding-top: 1rem; font-size: 1.2rem; color: rgba(255,255,255,0.3); transition: color 0.2s, transform 0.2s; }
    .post-row:hover .post-arrow { color: var(--white); transform: translateX(4px); }

    .empty-msg { color: var(--mid); font-size: 0.9rem; padding: 5rem 2.5rem; }
    .loading-msg { color: var(--mid); font-size: 0.88rem; padding: 2rem 2.5rem; }

    footer { border-top: 1px solid rgba(255,255,255,0.08); padding: 2.5rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.72rem; letter-spacing: 0.1em; color: var(--mid); }

    @media (max-width: 768px) {
      nav { padding: 1.25rem; } .nav-links { display: none; }
      .page-top { padding-left: 1.25rem; padding-right: 1.25rem; padding-top: 7rem; }
      .post-row { grid-template-columns: 1fr; }
      .post-row-body { padding: 1.5rem; }
      footer { flex-direction: column; gap: 0.5rem; text-align: center; padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html">Duckzi</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="post.html?id=mira-game-jam">Mira</a></li>
      <li><a href="modding.html" class="active">Modding</a></li>
      <li><a href="art.html">Art</a></li>
      <li><a href="universe.html">Universe</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-socials">
      <a href="https://www.instagram.com/william._schell/"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-reddit-alien"></i></a>
      <a href="contact.html"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </nav>

  <div class="page-top">
    <p class="page-eyebrow">Mods & Maps</p>
    <h1>Modding</h1>
    <p>Custom mods, hand-crafted maps, and modpacks across games.</p>
  </div>

  <div class="section-inner" id="posts-container">
    <p class="loading-msg">Loading...</p>
  </div>

  <footer>
    <span>© 2025 William Schell / Duckzi</span>
    <div style="display:flex;gap:1.25rem;">
      <a href="https://www.instagram.com/william._schell/" style="color:inherit;text-decoration:none;"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </footer>

  <script>
    function fmtDate(d) { return new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
    fetch('posts.json').then(r=>r.json()).then(posts=>{
      const mc=posts.filter(p=>p.type==='modding').sort((a,b)=>new Date(b.date)-new Date(a.date));
      if (!mc.length) { document.getElementById('posts-container').innerHTML='<p class="empty-msg">Nothing here yet — check back soon.</p>'; return; }
      document.getElementById('posts-container').innerHTML=mc.map(p=>{
        const imgSrc=(p.images&&p.images.filter(Boolean)[0])||p.image||'';
        const imgHtml=imgSrc?`<img src="${imgSrc}" alt="${p.title}" onerror="this.style.display='none'">`:'⛏️';
        return `<a class="post-row" href="post.html?id=${p.id}">
          <div class="post-row-img">${imgHtml}</div>
          <div class="post-row-body">
            <span class="post-tag">Minecraft</span>
            <h3>${p.title}</h3>
            <p>${p.subtitle||p.description||''}</p>
            <span class="post-date">${fmtDate(p.date)}</span>
            <span class="post-arrow">→</span>
          </div>
        </a>`;
      }).join('');
    }).catch(()=>{ document.getElementById('posts-container').innerHTML='<p class="loading-msg">Could not load posts.</p>'; });
  </script>
</body>
</html>
